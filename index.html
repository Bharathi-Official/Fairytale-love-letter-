<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Love Letter ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&family=Great+Vibes&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
overflow:hidden;
font-family:'Poppins',sans-serif;
background:linear-gradient(135deg,#050816,#140a2f,#1c0f47);
position:relative;
padding:20px;
}

/* Background */

.stars{
position:absolute;
width:100%;
height:100%;
overflow:hidden;
z-index:-2;
}

.star{
position:absolute;
width:2px;
height:2px;
background:white;
border-radius:50%;
animation:twinkle 4s infinite;
}

@keyframes twinkle{
0%,100%{
opacity:0.2;
transform:scale(1);
}
50%{
opacity:1;
transform:scale(2);
}
}

/* Hearts */

.hearts{
position:absolute;
width:100%;
height:100%;
overflow:hidden;
z-index:-1;
pointer-events:none;
}

.heart{
position:absolute;
bottom:-50px;
font-size:22px;
animation:floatUp linear infinite;
opacity:0.8;
}

@keyframes floatUp{
0%{
transform:translateY(0);
opacity:0;
}
10%{
opacity:1;
}
100%{
transform:translateY(-120vh);
opacity:0;
}
}

/* Main */

.container{
width:100%;
max-width:500px;
display:flex;
flex-direction:column;
align-items:center;
text-align:center;
}

/* Title */

.title{
font-family:'Great Vibes',cursive;
font-size:65px;
line-height:1.2;
color:#ffb6ff;
text-shadow:0 0 20px rgba(255,182,255,0.8);
animation:glow 3s infinite alternate;
margin-bottom:10px;
}

@keyframes glow{
from{
text-shadow:0 0 10px #ffb6ff;
}
to{
text-shadow:0 0 30px #ff69b4;
}
}

.subtitle{
color:white;
opacity:0.8;
letter-spacing:2px;
margin-bottom:35px;
font-size:16px;
}

/* Envelope */

.envelope-wrapper{
display:flex;
justify-content:center;
align-items:center;
width:100%;
padding:0 10px;
}

.envelope{
position:relative;
width:100%;
max-width:370px;
height:280px;
background:linear-gradient(135deg,#ff5fb2,#ff7ecf);
border-radius:24px;
overflow:hidden;
cursor:pointer;
box-shadow:
0 0 25px rgba(255,105,180,0.5),
0 0 80px rgba(255,105,180,0.25);
transition:0.8s;
}

/* Top Fold */

.envelope::before{
content:"";
position:absolute;
top:0;
left:0;
width:100%;
height:100%;
background:linear-gradient(135deg,#ff9dd9,#ff5fb2);
clip-path:polygon(0 0,50% 55%,100% 0);
transform-origin:top;
transition:1s;
z-index:5;
}

.envelope.open::before{
transform:rotateX(180deg);
}

/* Front Text */

.front-text{
position:absolute;
top:52%;
left:50%;
transform:translate(-50%,-50%);
font-family:'Great Vibes',cursive;
font-size:46px;
color:rgba(255,255,255,0.45);
z-index:2;
transition:0.5s;
pointer-events:none;
text-align:center;
width:100%;
padding:0 15px;
line-height:1.2;
}

.envelope.open .front-text{
opacity:0;
}

/* Letter */

.letter{
position:absolute;
left:50%;
top:58%;
transform:translate(-50%,140%);
width:90%;
background:white;
border-radius:22px;
padding:24px 20px;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
transition:1s;
z-index:3;
box-shadow:0 10px 30px rgba(0,0,0,0.18);
}

.envelope.open .letter{
transform:translate(-50%,-50%);
}

/* Heading */

.letter h2{
font-family:'Great Vibes',cursive;
font-size:38px;
color:#ff4fa3;
margin-bottom:14px;
text-align:center;
line-height:1.2;
}

/* Question */

.question{
font-size:19px;
font-weight:600;
color:#333;
margin-bottom:20px;
text-align:center;
line-height:1.5;
}

/* Options */

.options{
width:100%;
display:flex;
flex-direction:column;
gap:14px;
}

.option-btn{
width:100%;
padding:15px;
border:none;
border-radius:45px;
background:linear-gradient(45deg,#ff4fa3,#8a5cff);
color:white;
font-size:17px;
font-weight:500;
cursor:pointer;
transition:0.3s;
}

.option-btn:hover{
transform:scale(1.03);
}

.message{
margin-top:15px;
font-size:16px;
font-weight:600;
min-height:24px;
text-align:center;
}

/* Swipe */

.swipe{
margin-top:28px;
color:white;
opacity:0.8;
font-size:16px;
animation:slide 1.5s infinite;
}

@keyframes slide{
0%{
transform:translateX(-8px);
}
50%{
transform:translateX(8px);
}
100%{
transform:translateX(-8px);
}
}

/* Loading */

.loading{
display:none;
flex-direction:column;
align-items:center;
margin-top:35px;
}

.loader{
width:70px;
height:70px;
border:6px solid rgba(255,255,255,0.2);
border-top:6px solid #ff69b4;
border-radius:50%;
animation:spin 1s linear infinite;
margin-bottom:18px;
}

@keyframes spin{
100%{
transform:rotate(360deg);
}
}

.loading p{
color:white;
font-size:18px;
letter-spacing:2px;
animation:pulse 2s infinite;
}

@keyframes pulse{
0%,100%{
opacity:0.5;
}
50%{
opacity:1;
}
}

/* Mobile */

@media(max-width:480px){

.title{
font-size:52px;
}

.envelope{
max-width:360px;
height:290px;
}

.front-text{
font-size:42px;
}

.letter{
padding:22px 18px;
}

.letter h2{
font-size:34px;
}

.question{
font-size:18px;
}

.option-btn{
font-size:16px;
padding:14px;
}

}

</style>
</head>

<body>

<div class="stars"></div>
<div class="hearts"></div>

<div class="container">

<h1 class="title">
A Letter For You ❤️
</h1>

<p class="subtitle">
Tap & Open The Envelope ✨
</p>

<div class="envelope-wrapper">

<div class="envelope" id="envelope">

<div class="front-text">
Tap To Open ❤️
</div>

<div class="letter">

<h2>Babyyyy 👀</h2>

<p class="question">
What is my fav nickname?
</p>

<div class="options">

<button class="option-btn" onclick="checkAnswer('correct')">
Baby Bear ❤️
</button>

<button class="option-btn" onclick="checkAnswer('wrong')">
Vampire
</button>

<button class="option-btn" onclick="checkAnswer('wrong')">
FlynRider
</button>

</div>

<p class="message" id="message"></p>

</div>

</div>

</div>

<p class="swipe">
↔ Tap Envelope To Open
</p>

<div class="loading" id="loading">

<div class="loader"></div>

<p>
Opening Your Fairytale...
</p>

</div>

</div>

<!-- Sounds -->

<audio id="openSound">
<source src="https://cdn.pixabay.com/audio/2022/03/15/audio_7c1d239b4b.mp3" type="audio/mp3">
</audio>

<audio id="successSound">
<source src="https://cdn.pixabay.com/audio/2022/10/16/audio_12b0c7443c.mp3" type="audio/mp3">
</audio>

<script>

/* Stars */

const starsContainer=document.querySelector('.stars');

for(let i=0;i<130;i++){

let star=document.createElement('div');

star.classList.add('star');

star.style.left=Math.random()*100+'%';
star.style.top=Math.random()*100+'%';
star.style.animationDuration=(Math.random()*5+2)+'s';

starsContainer.appendChild(star);

}

/* Hearts */

const heartsContainer=document.querySelector('.hearts');

function createHeart(){

const heart=document.createElement('div');

heart.classList.add('heart');

heart.innerHTML='💖';

heart.style.left=Math.random()*100+'vw';
heart.style.animationDuration=(Math.random()*5+5)+'s';
heart.style.fontSize=(Math.random()*20+18)+'px';

heartsContainer.appendChild(heart);

setTimeout(()=>{
heart.remove();
},10000);

}

setInterval(createHeart,400);

/* Envelope */

const envelope=document.getElementById('envelope');

envelope.addEventListener('click',()=>{

envelope.classList.toggle('open');

document.getElementById('openSound').play();

});

/* Answer */

function checkAnswer(type){

const msg=document.getElementById('message');

if(type==='correct'){

msg.innerHTML='Correct Baby Bear ❤️';
msg.style.color='green';

document.getElementById('successSound').play();

setTimeout(()=>{

document.getElementById('loading').style.display='flex';

setTimeout(()=>{
window.location.href='letter.html';
},3000);

},1000);

}
else{

msg.innerHTML='Wrong answer 🥺 Try again';
msg.style.color='red';

}

}

</script>

</body>
</html>
